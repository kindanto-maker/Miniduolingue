<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>MiniDuolingo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * { box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(180deg, #e9f7df, #f4f6fb);
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .app {
      background: white;
      width: 380px;
      border-radius: 22px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.12);
      padding: 20px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    h1 {
      margin: 0;
      color: #58cc02;
      font-size: 20px;
    }

    h2 {
      text-align: center;
      margin: 20px 0 10px;
    }

    .badges {
      display: flex;
      gap: 6px;
    }

    .xp-badge, .streak {
      padding: 6px 10px;
      border-radius: 12px;
      font-weight: bold;
      font-size: 14px;
      white-space: nowrap;
    }

    .xp-badge {
      background: #fff4cc;
    }

    .streak {
      background: #ff9600;
      color: white;
    }

    .levels {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .level {
      padding: 16px;
      border-radius: 16px;
      border: none;
      background: #58cc02;
      color: white;
      font-size: 18px;
      cursor: pointer;
      transition: transform .1s, box-shadow .1s;
    }

    .level:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 15px rgba(0,0,0,0.15);
    }
